groups:
  - name: vote-api
    rules:
      # Disponibilidade -------------------------------------------------------
      - alert: VoteApiDown
        expr: up{job="vote-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "vote-api fora do ar"
          description: "O target vote-api nao responde ao scrape ha mais de 1 minuto."

      # Erros (RED) -----------------------------------------------------------
      - alert: HttpErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de 5xx acima de 1%"
          description: "Mais de 1% das requisicoes retornaram 5xx nos ultimos 5 minutos."

      # Latencia (SLO do teste de carga: p95 < 500ms) -------------------------
      - alert: VotoLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~".*votos"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 do endpoint de voto acima de 500ms"
          description: "A latencia p95 de POST .../votos ultrapassou o SLO de 500ms por 10 minutos."

      # Dependencia externa (elegibilidade) -----------------------------------
      - alert: ElegibilidadeCircuitOpen
        expr: resilience4j_circuitbreaker_state{name="userInfo", state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuito da elegibilidade aberto"
          description: "O circuit breaker userInfo abriu; votos podem falhar com 503 (elegibilidade indisponivel)."

      # Saturacao de recursos -------------------------------------------------
      - alert: HikariPoolSaturated
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pool de conexoes do banco saturado"
          description: "Ha threads aguardando conexao no HikariCP ha mais de 2 minutos (gargalo de DB)."

      - alert: JvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
            / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Uso de heap acima de 90%"
          description: "Heap JVM acima de 90% do maximo por 10 minutos; risco de pausas de GC/OOM."
