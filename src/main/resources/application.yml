spring:
  application:
    name: vote-api
  datasource:
    hikari:
      pool-name: vote-hikari
      # Postgres do projeto tem max_connections=100. 30 da folga (3x) para uma instancia e ainda
      # deixa margem para varias replicas. NAO subir cegamente: pool grande demais so enfileira
      # dentro do Postgres e piora. Ajuste medindo as metricas hikaricp_* no Grafana.
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

vote:
  sessao:
    duracao-default-minutos: 1
  callback:
    base-url: http://localhost:8080
  elegibilidade:
    provider: sempre
    url: https://user-info.herokuapp.com
    timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      # Publica buckets de histograma p/ http.server.requests -> permite p95/p99 por rota no
      # Prometheus/Grafana (histogram_quantile) e casa com o SLO medido no k6 (p95 < 500ms).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s

resilience4j:
  circuitbreaker:
    instances:
      userInfo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - com.sicredi.vote.application.exception.ElegibilidadeIndisponivelException
  retry:
    instances:
      userInfo:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.sicredi.vote.application.exception.ElegibilidadeIndisponivelException

---
spring:
  config:
    activate:
      on-profile: local-h2
  datasource:
    url: jdbc:h2:file:./data/vote;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
  docker:
    compose:
      enabled: false
